version: '3.8'
services:
  web:
    build: .
    command: gunicorn hotel.wsgi:application --bind 0.0.0.0:8000
    ports:
      - "8000:8000"
    depends_on:
      - redis
    environment:
      - DJANGO_SETTINGS_MODULE=hotel.settings
  celery:
    build: .
    command: celery -A hotel worker --loglevel=info
    depends_on:
      - redis
    environment:
      - DJANGO_SETTINGS_MODULE=hotel.settings
  beat:
    build: .
    command: celery -A hotel beat --loglevel=info
    depends_on:
      - redis
    environment:
      - DJANGO_SETTINGS_MODULE=hotel.settings
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
